name: Store reviewed CI repair source blobs
on:
  push:
    branches: [work/source-transfer-texture1d-20260915]
permissions:
  contents: write
jobs:
  transfer:
    if: github.repository == 'sunflower2333/dxvk'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact source bytes and store blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/transfer.py
      - uses: actions/upload-artifact@v4
        with:
          name: native-repair-source-receipt
          path: repair-receipt.json
          if-no-files-found: error
