name: Native UMD backend development
on:
  push:
    branches: [viogpu-umd-20260911]
  workflow_dispatch:
jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: |
          clang++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined tests/umd-identity.cpp -o identity-test
          ./identity-test
  backend:
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64, x86]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: git submodule update --init --recursive --depth 1
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64_${{ matrix.arch }}
      - name: Build embedded core without public API entry points
        shell: pwsh
        run: |
          python -m pip install meson ninja
          Invoke-WebRequest https://raw.githubusercontent.com/HansKristian-Work/vkd3d-proton-ci/main/glslangValidator.exe -OutFile glslangValidator.exe
          $env:PATH = "$PWD;$env:PATH"
          $cpu = if ('${{ matrix.arch }}' -eq 'arm64') { 'aarch64' } elseif ('${{ matrix.arch }}' -eq 'x64') { 'x86_64' } else { 'x86' }
          @"
          [binaries]
          c = 'cl'
          cpp = 'cl'
          ar = 'lib'
          windres = 'rc'
          [properties]
          needs_exe_wrapper = true
          [host_machine]
          system = 'windows'
          cpu_family = '$cpu'
          cpu = '${{ matrix.arch }}'
          endian = 'little'
          "@ | Set-Content native-umd-cross.ini
          meson setup build-umd --cross-file native-umd-cross.ini --buildtype release -Denable_umd=true -Denable_d3d8=false -Denable_d3d9=false -Denable_d3d10=false
          if ($LASTEXITCODE) { throw 'Meson configure failed' }
          ninja -C build-umd src/umd/dxvk-umd-backend-probe.exe
          if ($LASTEXITCODE) { throw 'Native backend build failed' }
          $imports = & dumpbin /imports build-umd/src/umd/dxvk-umd-backend-probe.exe | Out-String
          if ($imports -match 'D3D11CreateDevice|D3D11CoreCreateDevice|D3D11CreateDeviceAndSwapChain') { throw 'Backend reenters the D3D runtime' }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item build-umd/src/umd/dxvk-umd-backend-probe.exe artifacts
          Get-FileHash artifacts/dxvk-umd-backend-probe.exe | Format-List
          $imports | Set-Content artifacts/imports.txt
          'Internal backend test only; Windows runtime-to-DDI, native presentation and installability remain unvalidated.' | Set-Content artifacts/STATUS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dxvk-umd-backend-${{ matrix.arch }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
