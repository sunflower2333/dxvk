name: Standalone Microsoft runtime control
on:
  push:
    branches: [work/runtime-dispatch-20260913]
  workflow_dispatch:
jobs:
  control:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: windows-11-arm
            msvc: arm64
            machine: AA64
          - arch: x64
            runner: windows-2025-vs2026
            msvc: x64
            machine: 8664
          - arch: x86
            runner: windows-2025-vs2026
            msvc: x64_x86
            machine: 14C
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}
      - name: Build and run WARP-only control
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory artifacts | Out-Null
          cl /nologo /std:c++17 /EHsc /O2 /MT tests/umd-system-runtime.cpp d3d11.lib d3dcompiler.lib user32.lib /Fe:artifacts/dxvk-umd-system-runtime-test.exe
          if ($LASTEXITCODE) { throw 'Standalone runtime control build failed' }
          $headers = dumpbin /headers artifacts/dxvk-umd-system-runtime-test.exe | Out-String
          if ($LASTEXITCODE -or $headers -notmatch '${{ matrix.machine }} machine') { throw 'Wrong control architecture' }
          $process = Start-Process artifacts/dxvk-umd-system-runtime-test.exe -ArgumentList '--warp-only' -PassThru -RedirectStandardOutput artifacts/stdout.txt -RedirectStandardError artifacts/stderr.txt
          $null = $process.Handle
          if (!$process.WaitForExit(30000)) {
            $process.Kill(); $process.WaitForExit()
            throw 'WARP-only control exceeded 30 seconds'
          }
          $text = Get-Content artifacts/stdout.txt -Raw
          Write-Host $text
          if ($process.ExitCode -ne 0 -or $text -notmatch 'system runtime control PASS') {
            throw "Control failed: $(Get-Content artifacts/stderr.txt -Raw)"
          }
          "SOURCE=$env:GITHUB_SHA`nARCH=${{ matrix.arch }}`nMODE=--warp-only; Microsoft WARP control, not candidate rendering" | Set-Content artifacts/STATUS.txt
          Get-FileHash -Algorithm SHA256 artifacts/dxvk-umd-system-runtime-test.exe | Format-List | Tee-Object artifacts/hash.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dxvk-system-runtime-control-${{ matrix.arch }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
