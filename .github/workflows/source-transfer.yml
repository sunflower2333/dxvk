name: Store reviewed source bytes (no build or tests)
on:
  push:
    branches: [work/source-transfer-texture1d-20260915]
permissions:
  contents: write
jobs:
  store-source:
    if: github.repository == 'sunflower2333/dxvk'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Reconstruct and store the reviewed Git blob only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 store-source.py
      - uses: actions/upload-artifact@v4
        with:
          name: texture1d-source-receipt
          path: source-receipt.json
          if-no-files-found: error
          retention-days: 7
