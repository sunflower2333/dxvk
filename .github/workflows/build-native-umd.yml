name: Native UMD backend development
on:
  push:
    branches: [viogpu-umd-20260911, work/native-runtime-entry-20260912, work/native-resource-identity-20260912, work/native-runtime-backing-20260912, work/native-offline-contracts-20260915]
  pull_request:
    paths:
      - 'src/**'
      - 'tests/umd-*'
      - 'scripts/*native*'
      - 'scripts/test-umd-*'
      - 'subprojects/**'
      - 'meson.*'
      - '.github/workflows/build-native-umd.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-umd-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - run: git submodule update --init --recursive --depth 1
      - run: bash scripts/test-native-umd.sh
  backend:
    timeout-minutes: 30
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64, x86]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - run: git submodule update --init --recursive --depth 1
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'x64' && 'x64' || format('x64_{0}', matrix.arch) }}
      - name: Build embedded core and native DDI development library
        shell: pwsh
        run: ./scripts/build-native-umd.ps1 -OutputDirectory artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: dxvk-umd-backend-${{ matrix.arch }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
      - name: Retain failure diagnostics without publishing a usable candidate
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dxvk-umd-failure-${{ matrix.arch }}-${{ github.sha }}
          path: |
            artifacts/*.txt
            build-umd/meson-logs/*
          if-no-files-found: warn
  shader-cpu:
    timeout-minutes: 20
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - run: git submodule update --init --recursive --depth 1
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile real HLSL and verify reconstructed DXBC and SPIR-V interfaces
        shell: pwsh
        run: |
          python -m pip install meson ninja
          if ($LASTEXITCODE) { throw 'Shader build dependency installation failed' }
          meson setup build-shader subprojects/dxbc-spirv --buildtype release -Denable_sm3=false -Db_vscrt=md
          if ($LASTEXITCODE) { throw 'Shader compiler configure failed' }
          ninja -C build-shader
          if ($LASTEXITCODE) { throw 'Shader compiler library build failed' }
          $shaderTargets = meson introspect build-shader --targets | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'Shader compiler target discovery failed' }
          $shaderLibraries = @($shaderTargets | Where-Object { $_.name -eq 'dxbc_spv' -and $_.type -eq 'static library' })
          if ($shaderLibraries.Count -ne 1 -or $shaderLibraries[0].filename.Count -ne 1) { throw 'Unexpected shader compiler target layout' }
          $shaderLibrary = $shaderLibraries[0].filename[0]
          if (-not (Test-Path $shaderLibrary)) { throw 'Shader compiler library is missing' }
          cl /nologo /std:c++17 /EHsc /O1 /MD /DVIOGPU_SHADER_SPIRV_TEST /Isubprojects/dxbc-spirv `
            tests/umd-shader-container.cpp src/umd/umd_shader.cpp `
            $shaderLibrary `
            d3dcompiler.lib d3d11.lib /Fe:shader-cpu-test.exe
          if ($LASTEXITCODE) { throw 'Shader CPU test compile failed' }
          ./shader-cpu-test.exe
          if ($LASTEXITCODE) { throw 'Shader CPU test failed' }
  arm64-runtime:
    needs: backend
    runs-on: windows-11-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dxvk-umd-backend-arm64-${{ github.sha }}
          path: candidate
      - name: Execute native ARM64 runtime ownership and entry regressions
        shell: pwsh
        run: ./scripts/test-native-arm64.ps1 -Directory candidate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dxvk-native-runtime-arm64-validation-${{ github.sha }}
          path: candidate/arm64-*.txt
