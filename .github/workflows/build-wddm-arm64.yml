name: Build DXVK ARM64 for WDDM Turnip

on:
  workflow_dispatch:
    inputs:
      mesa_run_id:
        description: 'Successful Mesa run containing turnip-wddm-arm64-icd-bundle (optional)'
        required: false
        type: string
  push:
    branches:
      - wddm
    paths:
      - '.github/workflows/build-wddm-arm64.yml'
      - 'include/**'
      - 'src/**'
      - '*.ini'
      - '*.in'
      - '*.conf'
      - 'meson.build'
      - 'meson_options.txt'
      - 'build-winarm64.txt'
      - 'version.h.in'
      - 'scripts/package-wddm-arm64.ps1'
      - 'scripts/launch-wddm-arm64.ps1'
      - 'scripts/run-wddm-smoke-arm64.ps1'
      - 'tests/**'

jobs:
  build:
    name: ARM64 MSVC DXVK DLLs
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Setup shallow submodules
        shell: pwsh
        run: git submodule update --init --recursive --depth 1

      - name: Validate WDDM integration policy
        shell: pwsh
        run: python tests/check-wddm-integration.py

      - name: Download D3D8 SDK headers
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://raw.githubusercontent.com/NovaRain/DXSDK_Collection/master/DXSDK_Aug2007/Include/d3d8.h -OutFile include/d3d8.h
          Invoke-WebRequest -Uri https://raw.githubusercontent.com/NovaRain/DXSDK_Collection/master/DXSDK_Aug2007/Include/d3d8types.h -OutFile include/d3d8types.h
          Invoke-WebRequest -Uri https://raw.githubusercontent.com/NovaRain/DXSDK_Collection/master/DXSDK_Aug2007/Include/d3d8caps.h -OutFile include/d3d8caps.h

      - name: Setup glslangValidator
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://raw.githubusercontent.com/HansKristian-Work/vkd3d-proton-ci/main/glslangValidator.exe -OutFile glslangValidator.exe
          Add-Content -Path $env:GITHUB_PATH -Value $PWD

      - name: Configure ARM64 developer environment
        shell: pwsh
        run: |
          $installationPath = Get-VSSetupInstance |
            Select-VSSetupInstance -Require Microsoft.VisualStudio.Workload.NativeDesktop -Latest |
            Select-Object -ExpandProperty InstallationPath
          if ([string]::IsNullOrWhiteSpace($installationPath)) {
            throw 'Visual Studio NativeDesktop installation was not found'
          }
          $vsDevCmd = Join-Path $installationPath 'Common7\Tools\VsDevCmd.bat'
          & $env:COMSPEC /s /c "`"$vsDevCmd`" -arch=arm64 -host_arch=x64 -no_logo && set" |
            ForEach-Object { , ($_ -Split '=', 2) } |
            ForEach-Object { [Environment]::SetEnvironmentVariable($_[0], $_[1]) }
          Write-Host "Using ARM64 toolchain from $vsDevCmd"
          Get-Command cl.exe | Format-List Source

      - name: Configure and build
        shell: pwsh
        run: |
          $installationPath = Get-VSSetupInstance |
            Select-VSSetupInstance -Require Microsoft.VisualStudio.Workload.NativeDesktop -Latest |
            Select-Object -ExpandProperty InstallationPath
          $vsDevCmd = Join-Path $installationPath 'Common7\Tools\VsDevCmd.bat'
          & $env:COMSPEC /s /c "`"$vsDevCmd`" -arch=arm64 -host_arch=x64 -no_logo && set" |
          ForEach-Object { , ($_ -Split '=', 2) } |
            ForEach-Object { [Environment]::SetEnvironmentVariable($_[0], $_[1]) }
          python -m pip install --disable-pip-version-check meson
          meson setup --cross-file build-winarm64.txt --buildtype release --backend ninja build-msvc-arm64
          ninja -C build-msvc-arm64

      - name: Validate ARM64 PE output
        shell: pwsh
        run: |
          $output = Join-Path $PWD 'artifacts\arm64'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $installationPath = Get-VSSetupInstance |
            Select-VSSetupInstance -Require Microsoft.VisualStudio.Workload.NativeDesktop -Latest |
            Select-Object -ExpandProperty InstallationPath
          if ([string]::IsNullOrWhiteSpace($installationPath)) {
            throw 'Visual Studio NativeDesktop installation was not found'
          }
          $vsDevCmd = Join-Path $installationPath 'Common7\Tools\VsDevCmd.bat'
          & $env:COMSPEC /s /c "`"$vsDevCmd`" -arch=arm64 -host_arch=x64 -no_logo && set" |
            ForEach-Object { , ($_ -Split '=', 2) } |
            ForEach-Object { [Environment]::SetEnvironmentVariable($_[0], $_[1]) }
          $dlls = Get-ChildItem -Path (Join-Path $PWD 'build-msvc-arm64\src') -Recurse -File -Filter '*.dll'
          if ($dlls.Count -eq 0) {
            throw 'No DXVK DLLs were produced'
          }
          $required = @('d3d8.dll', 'd3d9.dll', 'd3d10core.dll', 'd3d11.dll', 'dxgi.dll')
          $present = @($dlls | ForEach-Object Name)
          $missing = @($required | Where-Object { $_ -notin $present })
          if ($missing.Count -ne 0) {
            throw "DXVK package is missing required DLLs: $($missing -join ', ')"
          }
          $clPath = (Get-Command cl.exe -ErrorAction Stop).Source
          $linkPath = Join-Path (Split-Path -Parent $clPath) 'link.exe'
          if (-not (Test-Path -Path $linkPath -PathType Leaf)) {
            throw "MSVC linker was not found beside cl.exe: $linkPath"
          }
          foreach ($dll in $dlls) {
            $headers = (& $linkPath /dump /headers $dll.FullName | Out-String)
            if ($headers -notmatch 'ARM64') {
              throw "DXVK output is not ARM64: $($dll.Name)"
            }
            Copy-Item $dll.FullName $output
          }
          @'
          DXVK ARM64 app-local package for the DroidVM Turnip WDDM ICD.

          Copy the DLLs beside the ARM64 D3D8/9/10/11 application. The application must
          load the matching Mesa vulkan_freedreno.dll and its app-local ICD manifest.
          DXVK_FILTER_DEVICE_LUID may be set to the 16 hexadecimal digits printed by
          the DXVK startup log when more than one WDDM adapter is visible.

          This package contains no kernel driver and does not install a system Vulkan
          ICD. KMD, Turnip, and DXVK rollback boundaries remain independent.
          '@ | Set-Content -Path (Join-Path $output 'README-wddm.txt') -Encoding ascii
          $hashes = Get-ChildItem -Path $output -File -Filter '*.dll' |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 -Path $_.FullName).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          $hashes | Set-Content -Path (Join-Path $output 'SHA256SUMS.txt') -Encoding ascii
          Get-ChildItem $output | Sort-Object Name | Format-Table Name, Length

      - name: Build native ARM64 D3D9/D3D10/D3D11 smoke workloads
        shell: pwsh
        run: |
          $installationPath = Get-VSSetupInstance |
            Select-VSSetupInstance -Require Microsoft.VisualStudio.Workload.NativeDesktop -Latest |
            Select-Object -ExpandProperty InstallationPath
          if ([string]::IsNullOrWhiteSpace($installationPath)) {
            throw 'Visual Studio NativeDesktop installation was not found'
          }
          $vsDevCmd = Join-Path $installationPath 'Common7\Tools\VsDevCmd.bat'
          & $env:COMSPEC /s /c "`"$vsDevCmd`" -arch=arm64 -host_arch=x64 -no_logo && set" |
            ForEach-Object { , ($_ -Split '=', 2) } |
            ForEach-Object { [Environment]::SetEnvironmentVariable($_[0], $_[1]) }
          $smoke = Join-Path $PWD 'artifacts\arm64\dxvk_wddm_d3d11_smoke_arm64.exe'
          cl /nologo /std:c++17 /W4 /WX /EHsc /MT `
            tests\wddm-d3d11-smoke.cpp `
            /Fe:$smoke /link d3d11.lib d3dcompiler.lib dxgi.lib
          $linkPath = (Get-Command link.exe -ErrorAction Stop).Source
          $headers = (& $linkPath /dump /headers $smoke 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $headers -notmatch 'ARM64') {
            throw 'D3D11 smoke workload is not an ARM64 PE image'
          }
          $imports = (& $linkPath /dump /imports $smoke 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $imports -notmatch 'D3D11CreateDevice' -or
              $imports -notmatch 'CreateDXGIFactory1' -or
              $imports -notmatch 'D3DCompile') {
            throw 'D3D11 smoke workload does not import the DXGI/D3D11/compiler entry points'
          }

          $smoke9 = Join-Path $PWD 'artifacts\arm64\dxvk_wddm_d3d9_smoke_arm64.exe'
          cl /nologo /std:c++17 /W4 /WX /EHsc /MT `
            tests\wddm-d3d9-smoke.cpp `
            /Fe:$smoke9 /link d3d9.lib user32.lib
          $headers9 = (& $linkPath /dump /headers $smoke9 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $headers9 -notmatch 'ARM64') {
            throw 'D3D9 smoke workload is not an ARM64 PE image'
          }
          $imports9 = (& $linkPath /dump /imports $smoke9 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $imports9 -notmatch 'Direct3DCreate9') {
            throw 'D3D9 smoke workload does not import Direct3DCreate9'
          }

          $smoke10 = Join-Path $PWD 'artifacts\arm64\dxvk_wddm_d3d10_smoke_arm64.exe'
          cl /nologo /std:c++17 /W4 /WX /EHsc /MT `
            tests\wddm-d3d10-smoke.cpp `
            /Fe:$smoke10 /link d3d10_1.lib dxgi.lib
          $headers10 = (& $linkPath /dump /headers $smoke10 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $headers10 -notmatch 'ARM64') {
            throw 'D3D10 smoke workload is not an ARM64 PE image'
          }
          $imports10 = (& $linkPath /dump /imports $smoke10 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $imports10 -notmatch 'D3D10CreateDevice1') {
            throw 'D3D10 smoke workload does not import D3D10CreateDevice1'
          }
          Write-Host 'Native ARM64 D3D9/D3D10/D3D11 smoke workloads linked; execute them only with the app-local bundle on the target VM.'

      - name: Upload ARM64 DXVK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dxvk-wddm-arm64-${{ github.sha }}
          path: artifacts/arm64/**
          if-no-files-found: error

      - name: Validate packaging scripts
        if: ${{ inputs.mesa_run_id != '' }}
        shell: pwsh
        run: |
          foreach ($path in @(
            'scripts/package-wddm-arm64.ps1',
            'scripts/launch-wddm-arm64.ps1',
            'scripts/run-wddm-smoke-arm64.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) {
              throw "PowerShell parse failed for ${path}: $($errors -join '; ')"
            }
          }

      - name: Download Mesa Turnip artifact with gh
        if: ${{ inputs.mesa_run_id != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path mesa-turnip | Out-Null
          gh run download '${{ inputs.mesa_run_id }}' --repo sunflower2333/mesa --name turnip-wddm-arm64-icd-bundle --dir mesa-turnip
          $manifests = @(Get-ChildItem -LiteralPath mesa-turnip -Recurse -File `
            -Filter freedreno_icd.arm64.json)
          if ($manifests.Count -ne 1) {
            throw "Mesa artifact must contain one ARM64 Turnip ICD manifest, found $($manifests.Count)"
          }
          "MESA_TURNIP_ROOT=$($manifests[0].Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - name: Assemble verified DXVK plus Turnip bundle
        if: ${{ inputs.mesa_run_id != '' }}
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/package-wddm-arm64.ps1 `
            -DxvkRoot (Join-Path $PWD 'build-msvc-arm64/src') `
            -TurnipBundleRoot $env:MESA_TURNIP_ROOT `
            -SmokeRoot (Join-Path $PWD 'artifacts/arm64') `
            -OutputRoot (Join-Path $PWD 'artifacts/wddm-arm64') `
            -DxvkRevision $env:GITHUB_SHA `
            -MesaRepository 'sunflower2333/mesa' `
            -MesaRunId '${{ inputs.mesa_run_id }}'
          $provenance = Join-Path $PWD 'artifacts/wddm-arm64/BUILD-PROVENANCE.txt'
          if (-not (Test-Path -LiteralPath $provenance -PathType Leaf)) {
            throw 'Combined bundle is missing BUILD-PROVENANCE.txt'
          }
          $provenanceText = Get-Content -LiteralPath $provenance -Raw
          foreach ($requiredLine in @(
            "DXVK_REVISION=$env:GITHUB_SHA",
            'MESA_REPOSITORY=sunflower2333/mesa',
            'MESA_RUN_ID=${{ inputs.mesa_run_id }}',
            'RUNTIME_STATUS=compile-and-package-evidence-only'
          )) {
            if ($provenanceText -notmatch [regex]::Escape($requiredLine)) {
              throw "Combined bundle provenance is missing: $requiredLine"
            }
          }
          foreach ($name in @(
            'dxvk_wddm_d3d9_smoke_arm64.exe',
            'dxvk_wddm_d3d10_smoke_arm64.exe',
            'dxvk_wddm_d3d11_smoke_arm64.exe'
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $PWD "artifacts/wddm-arm64/$name") -PathType Leaf)) {
              throw "Combined bundle is missing smoke workload: $name"
            }
          }

      - name: Upload DXVK plus Turnip bundle
        if: ${{ inputs.mesa_run_id != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: dxvk-turnip-wddm-arm64-${{ github.sha }}
          path: artifacts/wddm-arm64/**
          if-no-files-found: error
