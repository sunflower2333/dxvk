name: Native UMD backend development
on:
  push:
    branches: [viogpu-umd-20260911]
  workflow_dispatch:
jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: git submodule update --init --recursive --depth 1
      - run: bash scripts/test-native-umd.sh
  backend:
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64, x86]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: git submodule update --init --recursive --depth 1
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'x64' && 'x64' || format('x64_{0}', matrix.arch) }}
      - name: Build embedded core and native DDI development library
        shell: pwsh
        run: ./scripts/build-native-umd.ps1 -OutputDirectory artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: dxvk-umd-backend-${{ matrix.arch }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
  shader-cpu:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: git submodule update --init --recursive --depth 1
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile real HLSL and verify reconstructed DXBC and SPIR-V interfaces
        shell: pwsh
        run: |
          python -m pip install meson ninja
          if ($LASTEXITCODE) { throw 'Shader build dependency installation failed' }
          meson setup build-shader subprojects/dxbc-spirv --buildtype release -Denable_sm3=false
          if ($LASTEXITCODE) { throw 'Shader compiler configure failed' }
          ninja -C build-shader
          if ($LASTEXITCODE) { throw 'Shader compiler library build failed' }
          cl /nologo /std:c++17 /EHsc /O1 /DVIOGPU_SHADER_SPIRV_TEST /Isubprojects/dxbc-spirv `
            tests/umd-shader-container.cpp src/umd/umd_shader.cpp `
            build-shader/dxbc_spv.lib `
            d3dcompiler.lib /Fe:shader-cpu-test.exe
          if ($LASTEXITCODE) { throw 'Shader CPU test compile failed' }
          ./shader-cpu-test.exe
          if ($LASTEXITCODE) { throw 'Shader CPU test failed' }
