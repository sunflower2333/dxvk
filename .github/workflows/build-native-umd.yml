name: Native UMD backend development
on:
  push:
    branches: [viogpu-umd-20260911]
  workflow_dispatch:
jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: |
          clang++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined tests/umd-identity.cpp -o identity-test
          ./identity-test
  backend:
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64, x86]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: git submodule update --init --recursive --depth 1
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'x64' && 'x64' || format('x64_{0}', matrix.arch) }}
      - name: Build embedded core and native DDI development library
        shell: pwsh
        run: ./scripts/build-native-umd.ps1 -OutputDirectory artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: dxvk-umd-backend-${{ matrix.arch }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
