name: Native UMD backend development
on:
  push:
    branches: [viogpu-umd-20260911]
  workflow_dispatch:
jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: git submodule update --init --recursive --depth 1
      - run: bash scripts/test-native-umd.sh
  backend:
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64, x86]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: git submodule update --init --recursive --depth 1
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'x64' && 'x64' || format('x64_{0}', matrix.arch) }}
      - name: Build embedded core and native DDI development library
        shell: pwsh
        run: ./scripts/build-native-umd.ps1 -OutputDirectory artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: dxvk-umd-backend-${{ matrix.arch }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
  shader-cpu:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: git submodule update --init --recursive --depth 1
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile real HLSL, rebuild DDI shader containers and reflect them
        shell: pwsh
        run: |
          cl /nologo /std:c++17 /EHsc /O1 /Isubprojects/dxbc-spirv `
            tests/umd-shader-container.cpp src/umd/umd_shader.cpp `
            subprojects/dxbc-spirv/dxbc/dxbc_container.cpp `
            subprojects/dxbc-spirv/dxbc/dxbc_parser.cpp `
            subprojects/dxbc-spirv/dxbc/dxbc_signature.cpp `
            subprojects/dxbc-spirv/dxbc/dxbc_types.cpp `
            subprojects/dxbc-spirv/ir/ir.cpp `
            subprojects/dxbc-spirv/util/util_swizzle.cpp `
            subprojects/dxbc-spirv/util/util_log.cpp `
            subprojects/dxbc-spirv/util/util_md5.cpp `
            d3dcompiler.lib /Fe:shader-cpu-test.exe
          if ($LASTEXITCODE) { throw 'Shader CPU test compile failed' }
          ./shader-cpu-test.exe
          if ($LASTEXITCODE) { throw 'Shader CPU test failed' }
